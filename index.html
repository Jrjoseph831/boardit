<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whiteboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='5' width='26' height='20' rx='3' fill='none' stroke='%23333' stroke-width='2.5'/%3E%3Cpath d='M9 19l5-6 4 4 5-7' fill='none' stroke='%23333' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <section id="home" hidden></section>
  <div id="stage" hidden>
    <div id="scroller"><div id="spacer"></div></div>
    <canvas id="cv"></canvas>
    <textarea id="ed" hidden spellcheck="false"></textarea>
    <aside id="toolbar" aria-label="Tools"></aside>
    <button id="reveal" aria-label="Show tools"></button>
  </div>
  <nav id="tabs" aria-label="Boards"></nav>
</div>
<div id="modal" hidden></div>
<div id="toast" role="status" hidden></div>
<input type="file" id="file" accept=".docx,.docm,.dotx,.dotm,.doc,.dot,.rtf,.htm,.html" hidden>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cfb@1.2.2/dist/cfb.min.js"></script>
<script src="app.js"></script>
</body>
</html>
